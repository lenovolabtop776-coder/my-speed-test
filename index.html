
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Speed Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #081426;
    color: white;
}

header {
    padding: 25px;
    background: #10233e;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #38bdf8;
}

header span {
    color: #94a3b8;
}

main {
    max-width: 900px;
    margin: 50px auto;
    padding: 20px;
    text-align: center;
}

h1 {
    font-size: 36px;
}

.description {
    color: #94a3b8;
    margin-bottom: 40px;
}

.speed-box {
    background: #12243d;
    border: 1px solid #263e5e;
    border-radius: 20px;
    padding: 35px 20px;
}

.speed-circle {
    width: 230px;
    height: 230px;
    margin: 25px auto;
    border: 10px solid #1e466b;
    border-top-color: #38bdf8;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.speed-circle strong {
    font-size: 55px;
    color: #38bdf8;
}

.speed-circle small {
    color: #94a3b8;
}

button {
    background: #0284c7;
    color: white;
    border: none;
    padding: 17px 45px;
    border-radius: 12px;
    font-size: 19px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0ea5e9;
    transform: scale(1.04);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.results {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.result {
    background: #1a304c;
    padding: 20px 10px;
    border-radius: 12px;
}

.result h3 {
    color: #94a3b8;
    font-size: 15px;
}

.result p {
    font-size: 22px;
    color: #38bdf8;
    font-weight: bold;
}

footer {
    margin-top: 45px;
    color: #64748b;
}

@media(max-width:600px) {
    .results {
        grid-template-columns: repeat(2, 1fr);
    }

    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">MY SPEED TEST</div>
    <span>Internet Speed Testing</span>
</header>

<main>

    <h1>اختبر سرعة الإنترنت لديك</h1>

    <p class="description">
        اكتشف سرعة اتصالك بالإنترنت بسهولة ودقة
    </p>

    <section class="speed-box">

        <div class="speed-circle">
            <strong>--</strong>
            <small>Mbps</small>
        </div>

        <button disabled>سيتم تفعيل الاختبار قريباً</button>

        <div class="results">

            <div class="result">
                <h3>Download</h3>
                <p>-- Mbps</p>
            </div>

            <div class="result">
                <h3>Upload</h3>
                <p>-- Mbps</p>
            </div>

            <div class="result">
                <h3>Ping</h3>
                <p>-- ms</p>
            </div>

            <div class="result">
                <h3>Jitter</h3>
                <p>-- ms</p>
            </div>

        </div>

    </section>

    <footer>
        My Speed Test © 2026
    </footer>

</main>

</body>
</html>
